<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0c0c0d">
  <meta name="description" content="Отзывы покупателей о заказах в мастерской 3D-печати Voxel 3D.">
  <title>Опубликованные отзывы о Voxel 3D</title>
  <link rel="canonical" href="https://voxel-3d.github.io/reviews/published/">
  <link rel="icon" href="../../assets/voxel-logo-new.jpg">
  <link rel="stylesheet" href="../../style.css">
  <link rel="stylesheet" href="../reviews.css">
  <script src="../published.js" defer></script>
</head>
<body class="reviews-page">
  <a class="skip" href="#main">К содержимому</a>
  <header class="header">
    <a class="logo" href="../../" aria-label="Voxel 3D, главная">
      <img class="brand-image" src="../../assets/voxel-logo-new.jpg" alt="Voxel 3D">
    </a>
    <a class="small-cta" href="../../#reviews">На главную <span aria-hidden="true">↗</span></a>
  </header>
  <main id="main" class="wrap">
    <section class="section review-intro-copy" aria-labelledby="published-title">
      <h1 id="published-title">Отзывы о <em>Voxel 3D</em></h1>
      <p>Отзывы о заказах, оставленные на сайте мастерской.</p>
      <a class="button" href="../">Оставить отзыв <span aria-hidden="true">→</span></a>
    </section>
    <section class="section published-reviews" aria-labelledby="review-list-title">
      <h2 id="review-list-title">Опубликованные отзывы</h2>
      <p class="review-form-note" id="review-list-status" role="status"></p>
      <div class="reviews-grid" id="review-list"></div>
      <noscript><p>Включите JavaScript, чтобы прочитать опубликованные отзывы.</p></noscript>
    </section>
  </main>
  <footer class="wrap footer">
    <a href="../../">Voxel 3D</a>
    <a href="../../#reviews">Отзывы на Ozon ↗</a>
  </footer>
</body>
</html>
